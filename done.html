<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد إكمال المهمة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 90%;
        }
        .code {
            background: #28a745;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color: #28a745;">أحسنت! تم الوصول بنجاح</h2>
        <p>انسخ الكود التالي وضعه في خانة الإثبات على موقع المهام:</p>
        <div class="code">CODE-2026-OK</div>
        <p style="font-size: 12px; color: #777;">شكراً لجهدك!</p>
    </div>

</body>
</html>
